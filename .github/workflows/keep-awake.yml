name: Keep API awake

# Free hosting suspends an idle service, and the first request back can take most
# of a minute. This pings the health endpoint often enough that it never idles out.
#
# NOTE: GitHub disables scheduled workflows on a repository with no activity for
# 60 days, and its cron can run late under load. Treat this as the backup and use
# an external monitor (cron-job.org, UptimeRobot) as the primary - see
# docs/keeping-the-api-awake.md.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}      # and on demand, from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the API_URL secret to your deployed API, e.g. https://your-api.fly.dev"
            exit 1
          fi

          # A cold start can take ~60s, so allow generously and retry rather than
          # reporting a failure for a service that is merely waking up.
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 90 "$API_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Awake. Response: $(cat /tmp/body)"
              exit 0
            fi
            echo "Got HTTP $code; waiting before retry."
            sleep 15
          done

          echo "::error::API did not respond healthily after 3 attempts."
          cat /tmp/body || true
          exit 1
