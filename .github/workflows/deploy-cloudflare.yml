name: Deploy to Cloudflare

# Push to the branch and the app updates itself: tests, build, database
# migrations, then the Worker that serves both the API and the React app.
#
# What this needs, once, in Settings -> Secrets and variables -> Actions:
#
#   CLOUDFLARE_API_TOKEN   an API token with "Edit Cloudflare Workers", plus
#                          D1 edit and (if you use it) R2 edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
#
# See docs/cloudflare-setup.md. The token is as good as write access to this
# account's Workers: repository secrets only, never a committed file.

# Manual only.
#
# Cloudflare builds and deploys this repository itself (Workers Builds, set up in
# the dashboard), so a push-triggered deploy here would race it and do the same
# work twice. This is kept as the fallback - and because it runs the tests, which
# Workers Builds does not.
on:
  workflow_dispatch: {}

# A second push mid-deploy would race the first; whichever finished last would
# win regardless of which commit it carried.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Check the secrets and the database id are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set."; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set."; missing=1; }

          # The database id is not a secret, so it lives in the committed config -
          # but the placeholder would deploy a Worker whose every query fails.
          if grep -q 'REPLACE_WITH_YOUR_D1_DATABASE_ID' worker/wrangler.jsonc; then
            echo "::error::worker/wrangler.jsonc still has the placeholder database id. Run 'wrangler d1 create qa-platform' and commit the id it prints."
            missing=1
          fi

          [ "$missing" = 0 ] || { echo "See docs/cloudflare-setup.md."; exit 1; }

      - name: Install
        run: |
          npm ci --prefix worker
          npm ci --prefix web

      - name: Test the API
        run: npm test --prefix worker

      # A broken bundle would deploy perfectly happily and serve a blank page, so
      # the build runs before anything reaches Cloudflare.
      - name: Build the React app
        run: npm run build --prefix web

      # Migrations first: a Worker deployed against a database without its tables
      # fails every request, and the deploy would still report success.
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply qa-platform --remote

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # The Worker answers before it is finished configuring, so this says plainly
      # which secret is still missing rather than leaving it to be found at sign-in.
      - name: Report what the deployment still needs
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::Set an APP_URL repository variable to your workers.dev URL and this step will check it after each deploy."
            exit 0
          fi

          body=$(curl -sS --max-time 30 "$APP_URL/api/health" || echo '{}')
          echo "$body"
          if echo "$body" | grep -q '"status":"ok"'; then
            echo "::notice::$APP_URL is healthy."
          else
            echo "::warning::$APP_URL is not reporting healthy yet. The response above names what is missing."
          fi
